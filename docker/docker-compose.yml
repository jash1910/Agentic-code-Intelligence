version: "3.9"

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - RUN_MODE=mock
      - RAG_ENABLED=true
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=archonai
      - JWT_SECRET=archonai-production-secret
      - SANDBOX_USE_DOCKER=false
    volumes:
      - ../rag/chroma_db:/app/rag/chroma_db
      - ../knowledge_graph/cache:/app/knowledge_graph/cache
    depends_on:
      - neo4j
      - chromadb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  neo4j:
    image: neo4j:5.19-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/archonai
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped

  sandbox:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    profiles:
      - sandbox
    deploy:
      replicas: 0

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"
    profiles:
      - observability
    restart: unless-stopped

volumes:
  neo4j_data:
  chroma_data:
